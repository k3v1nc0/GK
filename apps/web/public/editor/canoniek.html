<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GK Canonieke werkbank</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; --bg: #0f172a; --panel: #111c33; --line: #26324a; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #22c55e; --err: #f87171; --warn: #facc15; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      header a { color: var(--accent); }
      #canonicalApp { max-width: 980px; margin: 0 auto; padding: 12px 16px 40px; }
      .cwTabs { display: flex; gap: 6px; margin-bottom: 8px; }
      button { background: var(--accent); color: #04121f; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; }
      button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
      button[aria-pressed="true"] { outline: 2px solid var(--text); }
      button:disabled { opacity: .45; cursor: default; }
      .cwStatus { min-height: 22px; margin: 6px 0; color: var(--muted); }
      .cwStatus[data-kind="ok"] { color: var(--ok); } .cwStatus[data-kind="error"] { color: var(--err); } .cwStatus[data-kind="dirty"] { color: var(--warn); }
      .cwForm { display: grid; gap: 8px; max-width: 520px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
      .cwForm label, .cwRow label { display: grid; gap: 3px; } .cwForm label span, .cwRow label span { color: var(--muted); font-size: 12px; }
      input, select { background: #0b1324; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
      .cwForm label.cwCheck { display: flex; gap: 8px; align-items: center; } .cwForm label.cwCheck span { color: var(--text); font-size: 14px; }
      .cwRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 8px 0; }
      .cwHint { color: var(--muted); margin: 4px 0; }
      .cwTable { width: 100%; border-collapse: collapse; } .cwTable th, .cwTable td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
      .cwArchived td { opacity: .5; } .cwActive td { color: var(--ok); }
      .cwMap { width: 100%; max-width: 480px; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: crosshair; }
      .cwReport { max-height: 320px; overflow: auto; background: #0b1324; padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
      .cwSplit { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; } .cwSplit .cwForm { flex: 1 1 240px; margin: 0; }
      .cw3d { display: block; width: 100%; height: 420px; border: 1px solid var(--line); border-radius: 6px; }
      .cwBadge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #1e293b; } .cwBadge[data-writer="canonical"] { background: #14532d; }
      .cwAudit { color: var(--muted); padding-left: 18px; }
    </style>
  </head>
  <body>
    <header><strong>GK · Canonieke werkbank</strong><a href="/editor/">Naar Nodes-editor</a><a href="/game/" target="_blank" rel="noopener">Game openen</a></header>
    <div id="canonicalApp"></div>
    <script type="module" src="./canonical-slice.js"></script>
  </body>
</html>
