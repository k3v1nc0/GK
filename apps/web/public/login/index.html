<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GK Game | Inloggen</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="./styles.css?v=20261105-game-login1">
  </head>
  <body>
    <main class="login-shell">
      <section class="hero">
        <p class="eyebrow">Online avontuur</p>
        <h1><span>GK</span><small>Game</small></h1>
        <p class="lede">Jouw avontuur begint hier</p>
      </section>

      <section class="panel" aria-labelledby="loginTitle">
        <header class="panel-heading">
          <span class="panel-rune" aria-hidden="true"></span>
          <div>
            <p class="panel-kicker">Spelersaccount</p>
            <h2 id="loginTitle">Welkom, avonturier</h2>
            <p>Log in om de wereld van GK te betreden.</p>
          </div>
        </header>

        <div id="sessionCard" class="session-card hidden">
          <div class="session-row">
            <span>Ingelogd als</span>
            <strong id="currentUserText">-</strong>
          </div>
          <div class="session-row">
            <span>Sessie</span>
            <strong id="currentSessionText">-</strong>
          </div>
          <div class="session-actions">
            <a id="continueLink" class="primary-link" href="/game/">Verder spelen</a>
            <button id="logoutButton" type="button" class="secondary-button">Uitloggen</button>
          </div>
        </div>

        <form id="accountForm" class="account-form">
          <label>
            Gebruikersnaam of e-mail
            <input name="identifier" autocomplete="username" required placeholder="Vul je gebruikersnaam in">
          </label>
          <label>
            Wachtwoord
            <input name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Vul je wachtwoord in">
          </label>
          <div class="button-row">
            <button type="submit" data-action="login" class="primary-button">Inloggen</button>
            <button type="submit" data-action="register" class="secondary-button">Nieuw account</button>
          </div>
          <p id="statusText" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <p class="world-note"><span aria-hidden="true"></span> De wereld wacht op je</p>
    </main>
    <script type="module" src="./login.js?v=20261105-game-login1"></script>
  </body>
</html>
